# Local development stack.
#
# Only Postgres is defined here because it is the only service the application
# actually connects to. Redis, Weaviate and MinIO were previously declared but
# no code in this repository opened a connection to any of them - they cost
# ~2GB of RAM on every `docker compose up` for nothing. Re-add them in the same
# commit as the code that uses them.

services:
  postgres:
    image: postgres:15-alpine
    container_name: pulse_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse_password}
      POSTGRES_DB: ${POSTGRES_DB:-pulse_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse_user} -d ${POSTGRES_DB:-pulse_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
