version: "1"

services:
  # Backend API Service
  - type: web
    name: pulsekart-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pulsekart-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "https://pulsekart-web.onrender.com"

  # Frontend Web Service
  - type: web
    name: pulsekart-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: "https://pulsekart-api.onrender.com/v1"
      - key: API_URL
        value: "http://pulsekart-api:10000"

databases:
  - name: pulsekart-db
    databaseName: pulsekart
    user: pulsekart
    plan: free
