# Render Blueprint for PulseKart
# This file configures automatic deployment on Render

services:
  # Frontend (Next.js)
  - type: web
    name: pulsekart-frontend
    env: node
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: pulsekart-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /api/*
        destination: https://pulsekart-backend.onrender.com/api/*

  # Backend (NestJS)
  - type: web
    name: pulsekart-backend
    env: node
    branch: main
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://pulsekart-frontend.onrender.com
    databases:
      - name: pulsekart-db
        databaseName: pulsekart
        user: pulsekart

  # Optional: Background Worker
