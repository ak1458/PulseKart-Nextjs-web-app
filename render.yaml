# Render Blueprint for PulseKart
# This file configures automatic deployment on Render

services:
  # Frontend (Next.js)
  # Frontend deployed to Vercel
  
  # Backend (NestJS)
  - type: web
    name: pulsekart-backend
    env: node
    branch: refactor/cleanup-and-optimization
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_SYNC
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://pulsekart.vercel.app
    databases:
      - name: pulsekart-db
        databaseName: pulsekart
        user: pulsekart

  # Optional: Background Worker
