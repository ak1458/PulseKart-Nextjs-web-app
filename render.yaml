# PulseKart - Render Deployment Blueprint
# Perfect for startups - One click deploy everything!

services:
  # Frontend + Backend (Next.js with API routes)
  - type: web
    name: pulsekart
    runtime: node
    plan: free
    branch: refactor/cleanup-and-optimization
    buildCommand: |
      # Install dependencies
      npm install
      cd backend && npm install && cd ..
      
      # Build backend
      cd backend && npm run build && cd ..
      
      # Build frontend  
      npm run build
    startCommand: |
      # Start backend in background
      cd backend && npm run start:prod &
      
      # Start frontend
      npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: pulsekart
          type: web
          property: host
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pulsekart-db
          property: connectionString
    disk:
      name: uploads
      mountPath: /uploads
      sizeGB: 1

